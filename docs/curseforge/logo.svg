<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#2a3346"/>
      <stop offset="0.6" stop-color="#151a26"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.35" stop-color="#e8c25a"/>
      <stop offset="0.7" stop-color="#a87a22"/>
      <stop offset="1" stop-color="#6e4c12"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset="0.55" stop-color="#e6bd52"/>
      <stop offset="1" stop-color="#9c6f1c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <pattern id="seg" width="22" height="40" patternUnits="userSpaceOnUse">
      <rect x="21" width="2" height="40" fill="#000" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="512" height="512" rx="72" fill="url(#bg)"/>

  <!-- XP bar across the top -->
  <g filter="url(#shadow)">
    <rect x="40" y="70" width="432" height="26" rx="3" fill="#000" opacity="0.7"/>
    <rect x="43" y="73" width="300" height="20" fill="#8a3fc4"/>
    <rect x="43" y="73" width="300" height="20" fill="url(#shine)"/>
    <rect x="43" y="73" width="426" height="20" fill="url(#seg)"/>
  </g>

  <!-- profession bars, two on each side of the level box -->
  <g filter="url(#shadow)">
    <!-- icons -->
    <rect x="40" y="130" width="30" height="30" rx="4" fill="#5b3a8f" stroke="url(#gold)" stroke-width="2.5"/>
    <path d="M55 136 L60 146 L55 155 L50 146 Z" fill="#d7b4ff"/>
    <rect x="40" y="214" width="30" height="30" rx="4" fill="#2e5f8a" stroke="url(#gold)" stroke-width="2.5"/>
    <path d="M46 238 L64 220 M48 222 L62 236" stroke="#cfe6ff" stroke-width="3" stroke-linecap="round"/>
    <rect x="442" y="130" width="30" height="30" rx="4" fill="#8a2e2e" stroke="url(#gold)" stroke-width="2.5"/>
    <path d="M451 145 H463 M457 139 V151" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <rect x="442" y="214" width="30" height="30" rx="4" fill="#8a5a2e" stroke="url(#gold)" stroke-width="2.5"/>
    <circle cx="457" cy="229" r="8" fill="#f2c56b"/>

    <!-- left bars -->
    <rect x="40" y="168" width="150" height="26" rx="2" fill="#000" opacity="0.7"/>
    <rect x="42" y="170" width="120" height="22" fill="#bf73f2"/>
    <rect x="42" y="170" width="146" height="22" fill="url(#seg)"/>
    <rect x="42" y="170" width="120" height="22" fill="url(#shine)"/>
    <rect x="40" y="252" width="150" height="26" rx="2" fill="#000" opacity="0.7"/>
    <rect x="42" y="254" width="90" height="22" fill="#73a6f2"/>
    <rect x="42" y="254" width="146" height="22" fill="url(#seg)"/>
    <rect x="42" y="254" width="90" height="22" fill="url(#shine)"/>

    <!-- right bars -->
    <rect x="322" y="168" width="150" height="26" rx="2" fill="#000" opacity="0.7"/>
    <rect x="324" y="170" width="140" height="22" fill="#f2f2f2"/>
    <rect x="324" y="170" width="146" height="22" fill="url(#seg)"/>
    <rect x="324" y="170" width="140" height="22" fill="url(#shine)"/>
    <rect x="322" y="252" width="150" height="26" rx="2" fill="#000" opacity="0.7"/>
    <rect x="324" y="254" width="100" height="22" fill="#f2bf73"/>
    <rect x="324" y="254" width="146" height="22" fill="url(#seg)"/>
    <rect x="324" y="254" width="100" height="22" fill="url(#shine)"/>
  </g>

  <!-- level box -->
  <g filter="url(#shadow)">
    <rect x="200" y="140" width="112" height="112" rx="8" fill="url(#gold)"/>
    <rect x="207" y="147" width="98" height="98" rx="5" fill="#10141e"/>
    <text x="256" y="226" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif"
          font-weight="bold" font-size="72" fill="url(#goldText)" stroke="#3a2708" stroke-width="2">60</text>
  </g>

  <!-- reputation row -->
  <g filter="url(#shadow)">
    <rect x="40" y="330" width="432" height="44" rx="3" fill="#000" opacity="0.7"/>
    <rect x="43" y="333" width="330" height="38" fill="#2fa84a"/>
    <rect x="43" y="333" width="426" height="38" fill="url(#seg)"/>
    <rect x="43" y="333" width="330" height="38" fill="url(#shine)"/>
    <rect x="186" y="344" width="140" height="16" rx="8" fill="#fff" opacity="0.85"/>
  </g>
  <rect x="40" y="398" width="432" height="44" rx="3" fill="#000" opacity="0.7"/>
  <rect x="43" y="401" width="190" height="38" fill="#2f6fd6"/>
  <rect x="43" y="401" width="426" height="38" fill="url(#seg)"/>
  <rect x="43" y="401" width="190" height="38" fill="url(#shine)"/>
  <rect x="186" y="412" width="140" height="16" rx="8" fill="#fff" opacity="0.85"/>
</svg>
