<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Runenstein: the level on a carved diamond stone with a faint arcane edge. -->
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5c6068"/><stop offset="0.55" stop-color="#2d2f34"/><stop offset="1" stop-color="#1a1b1f"/>
    </linearGradient>
    <radialGradient id="inner" cx="50%" cy="42%" r="65%">
      <stop offset="0" stop-color="#2c2f38"/><stop offset="1" stop-color="#121317"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <polygon points="128,14 246,132 128,250 10,132" fill="#000" fill-opacity="0.6" filter="url(#drop)"/>
  <polygon points="128,6 244,122 128,238 12,122" fill="url(#stone)" stroke="#0e0f12" stroke-width="4"/>
  <polygon points="128,34 216,122 128,210 40,122" fill="url(#inner)" stroke="#6b707a" stroke-width="3"/>
  <polygon points="128,40 210,122 128,204 46,122" fill="none" stroke="#a078ff" stroke-opacity="0.45" stroke-width="2"/>
</svg>
